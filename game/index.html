<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Vault — a one-room heist</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0a12; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: #8d86a8; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em;
    background: rgba(10, 9, 18, .72); padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(141, 134, 168, .25); pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Velvet Vault: sneak past the guards and cameras, steal the Star Sapphire, and slip out the door before the alarm fills"></canvas>
<p id="sr" role="status" aria-live="polite"></p>
<div id="hint">WASD / arrows — move &nbsp;·&nbsp; Shift — sprint (loud) &nbsp;·&nbsp; E — crack the case &nbsp;·&nbsp; R — restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
